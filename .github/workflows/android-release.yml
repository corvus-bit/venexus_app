name: Android Play Store (AAB e APK)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code para a Play Store (deixe vazio para usar o número da execução)'
        required: false
        type: number

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Gerar AAB e APK assinados
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Criar .env com credenciais públicas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo '::error::Configure SUPABASE_URL e SUPABASE_ANON_KEY nos secrets do repositório.'
            exit 1
          fi
          printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > .env

      - name: Configurar chave de upload da Play Store
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Secret de assinatura ausente: $name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          test -s android/app/release.jks
          keytool -list -keystore android/app/release.jks -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
          chmod 600 android/app/release.jks

      - name: Dependências
        run: flutter pub get

      - name: Análise e testes
        run: |
          flutter analyze
          flutter test

      - name: Definir version code
        id: version
        env:
          BUILD_NUMBER: ${{ inputs.version_code || github.run_number }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || (( BUILD_NUMBER > 2100000000 )); then
            echo '::error::O version code deve ser um inteiro entre 1 e 2100000000.'
            exit 1
          fi
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Gerar AAB para Play Store
        env:
          PLAY_STORE_BUILD: 'true'
          ANDROID_UPLOAD_KEYSTORE: ${{ github.workspace }}/android/app/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release --build-number=${{ steps.version.outputs.build_number }}

      - name: Gerar APK assinado
        env:
          PLAY_STORE_BUILD: 'true'
          ANDROID_UPLOAD_KEYSTORE: ${{ github.workspace }}/android/app/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --build-number=${{ steps.version.outputs.build_number }}

      - name: Verificar assinaturas e preparar arquivos
        id: files
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          apk=build/app/outputs/flutter-apk/app-release.apk
          test -s "$aab"
          test -s "$apk"
          jarsigner -verify "$aab" > /dev/null
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -x "$apksigner"
          "$apksigner" verify "$apk"

          app_version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          test -n "$app_version"
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            label="$GITHUB_REF_NAME"
          else
            label="v${app_version}-build.${BUILD_NUMBER}"
          fi
          label="${label//\//-}"
          mkdir -p dist
          cp "$aab" "dist/venexus-${label}.aab"
          cp "$apk" "dist/venexus-${label}.apk"
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Guardar AAB e APK no workflow
        uses: actions/upload-artifact@v4
        with:
          name: venexus-android-${{ steps.files.outputs.label }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publicar release da tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Venexus ${{ steps.files.outputs.label }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.aab
            dist/*.apk

      - name: Remover material de assinatura do runner
        if: always()
        run: rm -f android/app/release.jks
