name: venexus
description: Aplicativo mobile Venexus para acolhimento, orientação, fórum, catálogo SENAI e perfil seguro.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  intl: ^0.19.0
  supabase_flutter: ^2.10.3
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
